# Builds UNSIGNED .ipa files on macOS runners. Sideloadly signs them with your free Apple ID.
#   release -> "LiveInterpreter": Release build, JS bundled inside, works anywhere (no PC needed)
#   dev     -> "Interp Dev": Debug dev client that loads JS from Metro on your PC
name: iOS build

on:
  push:
    branches: [main]
    paths: ["app/**", ".github/workflows/ios.yml"]
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.variant }}
    runs-on: macos-26 # Xcode 26.x; Expo SDK 58 needs Xcode >= 26.4
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: release
            configuration: Release
            app_variant: ""
            artifact: LiveInterpreter-ipa
            ipa: LiveInterpreter.ipa
          - variant: dev
            configuration: Debug
            app_variant: dev
            artifact: LiveInterpreter-dev-ipa
            ipa: LiveInterpreter-Dev.ipa
    env:
      APP_VARIANT: ${{ matrix.app_variant }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Show Xcode
        run: xcodebuild -version

      # npm ci deletes node_modules, so on a cache hit we skip it entirely.
      - name: Cache node_modules
        id: nm
        uses: actions/cache@v6
        with:
          path: app/node_modules
          key: nm-${{ runner.os }}-${{ hashFiles('app/package-lock.json') }}

      - name: npm ci
        if: steps.nm.outputs.cache-hit != 'true'
        run: npm ci

      # Generates app/ios from app.json + app.config.ts (it is not committed).
      - name: expo prebuild
        run: npx expo prebuild --platform ios --no-install

      - name: Cache Pods
        uses: actions/cache@v6
        with:
          path: app/ios/Pods
          key: pods-${{ matrix.variant }}-${{ runner.os }}-${{ hashFiles('app/package-lock.json', 'app/ios/Podfile', 'app/app.json') }}

      - name: pod install
        working-directory: app/ios
        run: pod install

      - name: xcodebuild (${{ matrix.configuration }}, iphoneos, unsigned)
        run: |
          set -o pipefail
          WORKSPACE=$(ls -d ios/*.xcworkspace | head -1)
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          echo "Workspace $WORKSPACE, scheme $SCHEME"
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration ${{ matrix.configuration }} \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee xcodebuild.log | xcbeautify --quieter

      - name: Package unsigned .ipa
        run: |
          rm -rf Payload && mkdir Payload
          cp -R build/Build/Products/${{ matrix.configuration }}-iphoneos/*.app Payload/
          if [ "${{ matrix.configuration }}" = "Release" ]; then
            ls Payload/*.app/main.jsbundle > /dev/null || { echo "Release build is missing main.jsbundle"; exit 1; }
          fi
          zip -qry ${{ matrix.ipa }} Payload
          ls -lh ${{ matrix.ipa }}

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: app/${{ matrix.ipa }}
          retention-days: 14

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: xcodebuild-log-${{ matrix.variant }}
          path: app/xcodebuild.log
          if-no-files-found: ignore
